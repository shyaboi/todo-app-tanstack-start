name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever needs to read the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # PLAN.md 4.7 vector 1. Runs first and independently: a leaked credential is
  # the one failure the other jobs cannot tell you about.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # gitleaks needs full history, not just the tip
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: no env files are tracked
        run: |
          if git ls-files --error-unmatch '.env' '.env.*' 2>/dev/null \
            | grep -v '^\.env\.example$' | grep -q .; then
            echo "::error::A .env file is tracked. See PLAN.md 4.7."
            exit 1
          fi
          echo "No tracked env files."

  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  # Gate on main only, per PLAN.md 5 rule 8. Added in PR 7.1.
  e2e:
    name: critical path
    if: github.base_ref == 'main' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
