name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only ever needs to read the tree.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '24'
  GITLEAKS_VERSION: '8.24.3'

jobs:
  # PLAN.md 4.7. Runs independently of the build: a leaked credential is the
  # one failure the other jobs cannot tell you about.
  secrets:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # the history scan needs every commit, not just the tip

      # Cheapest check first, so a tracked env file is still reported even if
      # the scanner itself fails to install.
      - name: no env files are tracked
        run: |
          tracked=$(git ls-files -- '.env' '.env.*' | grep -v '^\.env\.example$' || true)
          if [ -n "$tracked" ]; then
            echo "::error::Tracked env file(s): $tracked - see PLAN.md 4.7"
            exit 1
          fi
          echo "No tracked env files."

      # `git ls-files` only sees the CURRENT tree. A secret committed once and
      # deleted later is still in the history forever, and that is the case
      # worth failing over (PLAN.md 8.2).
      - name: no env file was EVER committed
        run: |
          ever=$(git log --all --pretty=format: --name-only --diff-filter=A \
                   -- '.env' '.env.*' | sort -u | grep -v '^$' | grep -v '^\.env\.example$' || true)
          if [ -n "$ever" ]; then
            echo "::error::An env file exists in history: $ever - rotate the credential, then rewrite history"
            exit 1
          fi
          echo "No env file has ever been committed."

      # The binary directly, not gitleaks-action. The action scans the range
      # BEFORE^..AFTER; on a first push BEFORE is the root commit, whose parent
      # does not exist, so the scan aborts having read 0 bytes and still reports
      # "no leaks found". `gitleaks git` scans all history unconditionally.
      - name: install gitleaks
        run: |
          mkdir -p "$RUNNER_TEMP/gitleaks"
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      # .gitleaks.toml adds a database-connection-URI rule. The default ruleset
      # does not match one, which would leave this project's only real
      # credential invisible to the scanner.
      - name: scan full history
        run: gitleaks git --no-banner --redact --exit-code 1 --config .gitleaks.toml .

  verify:
    name: typecheck · lint · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  permissions:
    name: permissions
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: tasker_integration

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: wait for mongo
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/27017) 2>/dev/null; then
              echo "mongo accepting connections after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::mongo did not accept connections within 30s"; exit 1

      # Asserts at the service layer that one account cannot reach another's
      # tasks. A browser-only guard cannot make this pass (PLAN.md 4.8).
      - run: npm run test:integration

  # PLAN.md 8.2. Boots the file the host actually runs. Every other job tests
  # source, which is how a green build reached a deployment and 404'd on every
  # path, and how a second one failed its first database call. A separate job
  # so its failure reads as "the build is broken", not "a test is flaky".
  artifact:
    name: built artifact
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: tasker_artifact

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: wait for mongo
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/27017) 2>/dev/null; then
              echo "mongo accepting connections after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::mongo did not accept connections within 30s"; exit 1

      - run: npm run build
      # Boots .output/server/index.mjs, asks it for every route, greps every
      # shipped byte for a value from env.ts, and holds the bundle to budget.
      - run: npm run test:artifact

  e2e:
    name: critical path
    runs-on: ubuntu-latest

    # CI gets its own throwaway database. The project's Atlas cluster is never
    # reachable from CI: no credential is stored here, so none can leak from
    # here, and a test run cannot touch real data (PLAN.md 4.7).
    services:
      mongo:
        image: mongo:8
        ports: ['27017:27017']

    env:
      MONGODB_URI: mongodb://localhost:27017
      MONGODB_DB: tasker_e2e

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # Readiness is checked here rather than with a container --health-cmd:
      # the inline form needs nested quoting inside YAML, and a wrong command
      # reports as "failed to initialize container" rather than as a bad
      # health check, which is a slow thing to diagnose. /dev/tcp is a bash
      # builtin, so this needs nothing installed.
      - name: wait for mongo
        run: |
          for i in $(seq 1 30); do
            if (exec 3<>/dev/tcp/localhost/27017) 2>/dev/null; then
              echo "mongo accepting connections after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::mongo did not accept connections within 30s"; exit 1

      - run: npx playwright install --with-deps chromium
      - run: npm run seed
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
